name: CI

# One job on JDK 17, the baseline: every build compiles with `release 17`, so the bytecode does not depend on the
# JDK, and 17 is the oldest runtime users have. Every run: build, tests and Javadoc of every module, and the JPMS
# smoke test. Pushes to master and release tags, and pull requests from this repository, add coverage and
# the SonarCloud analysis (not gating; pull requests from forks get no token). CI publishes nothing to Maven Central:
# releases are signed and uploaded by hand (see docs/releasing.md). After a green build, a push to master, or a run
# by hand on a branch, publishes SNAPSHOTs to maven.descoped.io (job snapshot), never a release.
on:
  push:
    branches: [master]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.claude/**'
      - '.github/workflows/claude.yml'
      - '.github/renovate.json'
      - '.gitignore'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.claude/**'
      - '.github/workflows/claude.yml'
      - '.github/renovate.json'
      - '.gitignore'
  # To run it on any branch by hand.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request ends the run it replaces. On a branch, runs queue instead: a cancelled
# snapshot job could leave the modules' SNAPSHOTs at different builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build (JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Coverage and SonarCloud: pushes, and pull requests from this repository (a fork's gets no secrets).
      ANALYSE: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # SonarCloud needs the history to attribute new code.
          fetch-depth: ${{ env.ANALYSE == 'true' && '0' || '1' }}
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880  # v6.3.0
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Build, test and Javadoc
        if: env.ANALYSE != 'true'
        run: ./mvnw --batch-mode --no-transfer-progress verify javadoc:javadoc

      - name: Build, test, Javadoc and coverage
        if: env.ANALYSE == 'true'
        run: ./mvnw --batch-mode --no-transfer-progress verify javadoc:javadoc -P coverage

      # The application view: a module that requires only the API finds every provider and uses filesystem,
      # PostgreSQL 18 and a fake GCS, on the module path and on the class path (Docker runs the stores).
      - name: JPMS smoke test
        run: src/it/jpms/run.sh

      # Analysis only: a SonarCloud outage or token problem must not fail the build, so this step does not gate.
      # On a pull request the scanner reads the pull request number, branch and base from GitHub Actions itself.
      - name: SonarCloud
        if: env.ANALYSE == 'true'
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}
        run: ./mvnw --batch-mode --no-transfer-progress -P sonar org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

  # SNAPSHOTs to Descoped's AWS CodeArtifact repository, read publicly at https://maven.descoped.io/, for development
  # across repositories: on a push to master (X.Y.Z-SNAPSHOT) and on a run by hand (X.Y.Z-<branch>-SNAPSHOT on a
  # branch other than master, so it never replaces master's). Never on a pull request or a tag. The role is taken
  # through GitHub's OIDC token: no secret. The profile descoped-snapshots refuses a release version, and so does the
  # guard below, before anything is uploaded.
  snapshot:
    name: Publish SNAPSHOTs
    needs: build
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
      || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880  # v6.3.0
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Branch version
        if: github.ref != 'refs/heads/master'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          version=$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout)
          name=$(printf '%s' "$BRANCH" | tr -c 'A-Za-z0-9.' '-')
          ./mvnw --batch-mode --no-transfer-progress versions:set -DgenerateBackupPoms=false \
            -DnewVersion="${version%-SNAPSHOT}-${name}-SNAPSHOT"

      - name: Only a SNAPSHOT
        run: |
          version=$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout)
          case "$version" in
            *-SNAPSHOT) echo "Publishing $version" ;;
            *) echo "Not a SNAPSHOT: $version"; exit 1 ;;
          esac

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: arn:aws:iam::764178632479:role/codeartifact-maven-snapshots-publisher
          aws-region: eu-north-1

      # The token is short-lived and comes from the role; settings.xml reads it from the environment.
      - name: CodeArtifact token
        run: |
          token=$(aws codeartifact get-authorization-token --domain descoped --domain-owner 764178632479 \
            --region eu-north-1 --query authorizationToken --output text)
          echo "::add-mask::$token"
          echo "CODEARTIFACT_AUTH_TOKEN=$token" >> "$GITHUB_ENV"
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'XML'
          <settings>
            <servers>
              <server>
                <id>descoped-snapshots</id>
                <username>aws</username>
                <password>${env.CODEARTIFACT_AUTH_TOKEN}</password>
              </server>
            </servers>
          </settings>
          XML

      - name: Deploy
        run: ./mvnw --batch-mode --no-transfer-progress -P descoped-snapshots -DskipTests deploy
